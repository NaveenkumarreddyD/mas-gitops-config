merge-key: "drroc4/drroc4/drgitopsapp"

account:
  id: drroc4

region:
  id: lac1

cluster:
  id: drroc4
  url: https://kubernetes.default.svc
  nonshared: ""

instance:
  id: drgitopsapp

# Publisher (write-scoped) static key. IBM's native postsync-update-sm job for SLS
# (instance-level) reads sm.aws_* -> sm_aws_* to write the SLS registration to AWS SM.
sm:
  aws_access_key_id: "<path:drroc4/drroc4/publisher#aws_access_key_id>"
  aws_secret_access_key: "<path:drroc4/drroc4/publisher#aws_secret_access_key>"
