merge-key: "roc4/roc4/rmasapp"

account:
  id: roc4

region:
  id: us-east-1

cluster:
  id: roc4
  url: https://kubernetes.default.svc
  nonshared: ""

instance:
  id: rmasapp

# Publisher (write-scoped) static key. IBM's native postsync-update-sm job for SLS
# (instance-level) reads sm.aws_* -> sm_aws_* to write the SLS registration to AWS SM.
sm:
  aws_access_key_id: "<path:roc4/roc4/publisher#aws_access_key_id>"
  aws_secret_access_key: "<path:roc4/roc4/publisher#aws_secret_access_key>"
