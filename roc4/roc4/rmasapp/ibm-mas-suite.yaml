merge-key: "roc4/roc4/rmasapp"

ibm_mas_suite:
  cert_manager_namespace: "cert-manager"
  ibm_entitlement_key: "<path:secret/data/roc4/roc4/entitlement#image_pull_secret_b64>"
  domain: rmasapp.apps.roc4.lac1.biz
  mas_channel: "8.11.x"
  icr_cp: "cp.icr.io/cp"
  icr_cp_open: "icr.io/cpopen"
  mas_install_plan: Automatic
  mas_feature_usage: true
  mas_deployment_progression: true
  mas_usability_metrics: true
  mas_annotations:
    mas.ibm.com/operationalMode: production
  # false (default): MAS auto-generates a self-signed core cert (no certs/public seed needed).
  # true: you provide the cert — seed certs/public in Vault and the tls_* lines below are rendered.
  mas_manual_cert_mgmt: false
