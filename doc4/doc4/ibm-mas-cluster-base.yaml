merge-key: "doc4/doc4"

account:
  id: doc4

region:
  id: us-east-1

cluster:
  id: doc4
  url: https://kubernetes.default.svc
  nonshared: ""

# Publisher (write-scoped) static key. IBM's native postsync-update-sm jobs (DRO here,
# cluster-level) read sm.aws_* -> sm_aws_* and use it to write generated secrets to AWS SM.
# AVP resolves these before the chart b64-encodes them into the job's mounted Secret.
sm:
  aws_access_key_id: "<path:doc4/doc4/publisher#aws_access_key_id>"
  aws_secret_access_key: "<path:doc4/doc4/publisher#aws_secret_access_key>"

custom_labels:
  environment: doc4
  platform: openshift
  gitops-owner: devops
