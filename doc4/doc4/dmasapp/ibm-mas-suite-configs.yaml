merge-key: "doc4/doc4/dmasapp"

# CONFIRM (branch codex/ibm-native-publisher): the SLSCfg/BASCfg refs below still read the
# custom publisher's layout (mas/<acct>/<cluster>[/<instance>]/{sls,dro}#url|api_token|ca.crt).
# IBM's native postsync-update-sm jobs write a DIFFERENT layout:
#   DRO -> <account>/<cluster>/dro           fields dro_url / dro_api_token / dro_ca_b64enc
#   SLS -> <account>/<icn>/<subscription>/sls fields sls_url / registration_key / ca_b64
# Before this branch works end-to-end, realign these refs AND resolve the 3 items in
# platform-gitops/MIGRATION-NOTES-ibm-native-publisher.md (b64 CA, ICN+subscription_id, mas/ prefix).
ibm_mas_suite_configs:
  - mas_config_name: "dmasapp-sls-system"
    mas_config_chart: ibm-mas-sls-config
    mas_config_scope: system
    mas_workspace_id:
    mas_application_id:
    mas_config_kind: "slscfgs"
    mas_config_api_version: "config.mas.ibm.com"
    use_postdelete_hooks: true
    registration_key: "<path:mas/doc4/doc4/dmasapp/sls#registration_key>"
    url: "<path:mas/doc4/doc4/dmasapp/sls#url>"
    ca:
      crt: "<path:mas/doc4/doc4/dmasapp/sls#ca.crt>"

  - mas_config_name: "dmasapp-bas-system"
    mas_config_chart: ibm-mas-bas-config
    mas_config_scope: system
    mas_workspace_id:
    mas_application_id:
    mas_config_kind: "bascfgs"
    mas_config_api_version: "config.mas.ibm.com"
    use_postdelete_hooks: true
    dro_endpoint_url: "<path:mas/doc4/doc4/dro#url>"
    dro_contact:
      email: "Najeeb.Mehboob@spireenergy.com"
      first_name: "Najeeb"
      last_name: "Mehboob"
    dro_api_token: "<path:mas/doc4/doc4/dro#api_token>"
    dro_ca:
      crt: "<path:mas/doc4/doc4/dro#ca.crt>"

  - mas_config_name: "dmasapp-mongo-system"
    mas_config_chart: ibm-mas-mongo-config
    mas_config_scope: system
    mas_workspace_id:
    mas_application_id:
    mas_config_kind: "mongocfgs"
    mas_config_api_version: "config.mas.ibm.com"
    use_postdelete_hooks: true
    username: "<path:mas/doc4/doc4/dmasapp/mongo#username>"
    password: "<path:mas/doc4/doc4/dmasapp/mongo#password>"
    config:
      hosts:
        - host: "<path:mas/doc4/doc4/dmasapp/mongo#host>"
          port: 27017
      configDb: admin
      authMechanism: DEFAULT
      retryWrites: false
      credentials:
        secretName: "system-mongo-credentials"
    certificates:
      - alias: ca
        crt: "<path:mas/doc4/doc4/dmasapp/mongo#ca.crt>"

  - mas_config_name: "dmasapp-jdbc-system"
    mas_config_chart: ibm-jdbc-config
    mas_config_scope: system
    mas_workspace_id:
    mas_application_id:
    mas_config_kind: "jdbccfgs"
    mas_config_api_version: "config.mas.ibm.com"
    use_postdelete_hooks: true
    jdbc_type: external
    jdbc_instance_name: oracle
    jdbc_instance_username: "<path:mas/doc4/doc4/dmasapp/jdbc-system#username>"
    jdbc_instance_password: "<path:mas/doc4/doc4/dmasapp/jdbc-system#password>"
    jdbc_connection_url: "<path:mas/doc4/doc4/dmasapp/jdbc-system#jdbc_url>"
    jdbc_ssl_enabled: false
    system_suite_jdbccfg_labels:
      mas.ibm.com/configScope: system
      mas.ibm.com/instanceId: dmasapp
