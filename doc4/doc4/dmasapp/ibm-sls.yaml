merge-key: "doc4/doc4/dmasapp"

ibm_sls:
  sls_channel: "3.x"
  sls_install_plan: Automatic
  sls_entitlement_file: "<path:mas/doc4/doc4/dmasapp/license#license_file>"
  ibm_entitlement_key: "<path:mas/doc4/doc4/entitlement#image_pull_secret_b64>"
  icr_cp_open: "icr.io/cpopen"
  # IBM's native postsync-update-sm job publishes SLS to AWS Secrets Manager. Enabled here
  # (the custom platform publisher was removed on branch codex/ibm-native-publisher).
  # NOTE: the SLS update-sm job ALSO requires application_admin_role: true, and reads the
  # publisher key from sm_aws_* (set the sm.* block in ibm-mas-instance-base.yaml.tpl to
  # <path:mas/doc4/doc4/publisher#...>). It writes to
  # <account>/<ibm_customer_number>/<subscription_id>/sls with fields
  # sls_url / registration_key / ca_b64 — see MIGRATION-NOTES-ibm-native-publisher.md (# CONFIRM).
  run_sync_hooks: true
  application_admin_role: true

  mongodb_provider: community
  sls_mongo_username: "<path:mas/doc4/doc4/dmasapp/sls-mongo#username>"
  sls_mongo_password: "<path:mas/doc4/doc4/dmasapp/sls-mongo#password>"
  sls_mongo_secret_name: sls-mongo-credentials

  mongo_spec:
    authMechanism: DEFAULT
    configDb: admin
    secretName: sls-mongo-credentials
    retryWrites: false
    nodes:
      - host: "<path:mas/doc4/doc4/dmasapp/mongo#host>"
        port: 27017
    certificates:
      # SLS trusts the same Mongo CA used by the MAS MongoCfg.
      - alias: mongoca
        crt: "<path:mas/doc4/doc4/dmasapp/mongo#ca.crt>"
