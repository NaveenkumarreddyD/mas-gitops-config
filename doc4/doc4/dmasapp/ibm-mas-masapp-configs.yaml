merge-key: "doc4/doc4/dmasapp"

ibm_mas_masapp_configs:
  - mas_app_id: manage
    mas_app_namespace: mas-dmasapp-manage
    mas_app_ws_apiversion: apps.mas.ibm.com/v1
    mas_app_ws_kind: ManageWorkspace
    mas_workspace_id: dmaswks

    # The Manage install chart owns the public certificate secret.
    mas_manual_cert_mgmt: false
    run_sanity_test: false

    # Per-bundle Liberty server.xml fragment. The chart creates a Secret per entry
    # (data.server-custom.xml = base64) and each serverBundle references it via
    # additionalServerConfig.secretName. Set these ONCE in config (NOT the UI — ArgoCD reverts
    # UI edits). Base64 is env-provided per bundle (cluster-specific: embeds the jms service host).
    # ALL FIVE ARE OPT-IN: a bundle's secret + additionalServerConfig render ONLY when its env var
    # is set. Leave a var EMPTY to let the Manage operator manage that bundle with its defaults.
    #   sb0-sb3 = JMS *client* fragments (ui, cron, mea, report).
    #   sb4     = JMS *server* fragment (standalonejms — server-side messaging engine / custom queues).
    mas_app_server_bundles_combined_add_server_config:
      dmaswks-manage-d--sb0--asc--sn: ""
      dmaswks-manage-d--sb1--asc--sn: ""
      dmaswks-manage-d--sb2--asc--sn: ""
      dmaswks-manage-d--sb4--asc--sn: ""
    mas_appws_spec:
      bindings:
        jdbc: system
      components:
        base:
          version: latest
        # hse = Health, Safety & Environment Manager (the rebranded Maximo for Oil & Gas).
        # It ships the psdi.plusg.* classes (e.g. PlusGPersonSet). REQUIRED to match prod, whose
        # data registers PERSON/other objects to plusg classes -> without hse the server can't
        # load PlusGPersonSet at startup and crashes. Must match prod components exactly.
        hse:
          version: latest
        oracleadapter:
          version: latest
        utilities:
          version: latest
        spatial:
          version: latest
      settings:
        aio:
          install: false
        db:
          dbSchema: maximo
          encryptionSecret: dmaswks-manage-encryptionsecret
          maxinst:
            tableSpace: MAX_DATA
            indexSpace: MAX_INDEX
            demodata: false
            bypassUpgradeVersionCheck: false
        languages:
          baseLang: EN
          secondaryLangs: []
        customizationList: []
        # Per IBM docs the pod resources block lives at settings.resources (NOT
        # settings.deployment.resources). At the wrong path the ManageWorkspace structural
        # schema prunes it on apply -> live CR never gets it -> permanent ArgoCD OutOfSync.
        resources:
          serverBundles:
            requests: { cpu: "1", memory: "4Gi" }
            limits:   { cpu: "6", memory: "10Gi" }
        deployment:
          autoGenerateEncryptionKeys: true
          defaultJMS: false
          serverTimezone: America/Chicago
          persistentVolumes:
            - { pvcName: jmsstore,  mountPath: /jmsstore,  size: 20Gi,  storageClassName: isilon, accessModes: [ReadWriteMany] }
            # mountPath MUST be /max_share: Manage's mxe.int.globaldir defaults to /max_share/intGlobalDir.
            # Mounting elsewhere (e.g. /globaldir) leaves that path unbacked -> graphite UI 404s (manage-shell not found).
            - { pvcName: globaldir, mountPath: /max_share, size: 20Gi, storageClassName: isilon, accessModes: [ReadWriteMany] }
          serverBundles:
            - name: ui
              bundleType: ui
              isDefault: true
              isMobileTarget: true
              replica: 2
              routeSubDomain: ui
              additionalServerConfig: { secretName: dmaswks-manage-d--sb0--asc--sn }
            - name: cron
              bundleType: cron
              isDefault: false
              replica: 1
              routeSubDomain: cron
              additionalServerConfig: { secretName: dmaswks-manage-d--sb1--asc--sn }
            - name: mea
              bundleType: mea
              isDefault: false
              isUserSyncTarget: true
              replica: 2
              routeSubDomain: mea
              additionalServerConfig: { secretName: dmaswks-manage-d--sb2--asc--sn }
            - name: report
              bundleType: report
              isDefault: false
              replica: 1
              routeSubDomain: report
            - name: jms
              bundleType: standalonejms
              isDefault: false
              replica: 1
              routeSubDomain: jms
              additionalServerConfig: { secretName: dmaswks-manage-d--sb4--asc--sn }
