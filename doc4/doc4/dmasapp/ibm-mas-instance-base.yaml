merge-key: "doc4/doc4/dmasapp"

account:
  id: doc4

region:
  id: lac1

cluster:
  id: doc4
  url: https://kubernetes.default.svc
  nonshared: ""

instance:
  id: dmasapp

# Publisher (write-scoped) static key. IBM's native postsync-update-sm job for SLS
# (instance-level) reads sm.aws_* -> sm_aws_* to write the SLS registration to AWS SM.
sm:
  aws_access_key_id: "<path:mas/doc4/doc4/publisher#aws_access_key_id>"
  aws_secret_access_key: "<path:mas/doc4/doc4/publisher#aws_secret_access_key>"
