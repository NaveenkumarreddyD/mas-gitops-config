merge-key: "nroc4/nroc4/nmasapp"

account:
  id: nroc4

region:
  id: lac1

cluster:
  id: nroc4
  url: https://kubernetes.default.svc
  nonshared: ""

instance:
  id: nmasapp

# Publisher (write-scoped) static key. IBM's native postsync-update-sm job for SLS
# (instance-level) reads sm.aws_* -> sm_aws_* to write the SLS registration to AWS SM.
sm:
  aws_access_key_id: "<path:nroc4/nroc4/publisher#aws_access_key_id>"
  aws_secret_access_key: "<path:nroc4/nroc4/publisher#aws_secret_access_key>"
