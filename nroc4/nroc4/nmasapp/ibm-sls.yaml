merge-key: "nroc4/nroc4/nmasapp"

ibm_sls:
  sls_channel: "3.x"
  sls_install_plan: Automatic
  sls_entitlement_file: "<path:mas/nroc4/nroc4/nmasapp/license#license_file>"
  ibm_entitlement_key: "<path:mas/nroc4/nroc4/entitlement#image_pull_secret_b64>"
  icr_cp_open: "icr.io/cpopen"
  # The IBM 8.4.2 hook accepts static AWS keys. The platform publisher replaces only
  # that write-back step and publishes SLS automatically with IAM Roles Anywhere.
  run_sync_hooks: false

  mongodb_provider: community
  sls_mongo_username: "<path:mas/nroc4/nroc4/nmasapp/sls-mongo#username>"
  sls_mongo_password: "<path:mas/nroc4/nroc4/nmasapp/sls-mongo#password>"
  sls_mongo_secret_name: sls-mongo-credentials

  mongo_spec:
    authMechanism: DEFAULT
    configDb: admin
    secretName: sls-mongo-credentials
    retryWrites: false
    nodes:
      - host: "<path:mas/nroc4/nroc4/nmasapp/mongo#host>"
        port: 27017
    certificates:
      # SLS trusts the same Mongo CA used by the MAS MongoCfg.
      - alias: mongoca
        crt: "<path:mas/nroc4/nroc4/nmasapp/mongo#ca.crt>"
