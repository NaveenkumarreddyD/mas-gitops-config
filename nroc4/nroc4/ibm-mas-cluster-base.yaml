merge-key: "nroc4/nroc4"

account:
  id: nroc4

region:
  id: lac1

cluster:
  id: nroc4
  url: https://kubernetes.default.svc
  nonshared: ""

# Publisher (write-scoped) static key. IBM's native postsync-update-sm jobs (DRO here,
# cluster-level) read sm.aws_* -> sm_aws_* and use it to write generated secrets to AWS SM.
# AVP resolves these before the chart b64-encodes them into the job's mounted Secret.
sm:
  aws_access_key_id: "<path:mas/nroc4/nroc4/publisher#aws_access_key_id>"
  aws_secret_access_key: "<path:mas/nroc4/nroc4/publisher#aws_secret_access_key>"

custom_labels:
  environment: nroc4
  platform: openshift
  gitops-owner: devops
